name: Android SQLCipher checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-sqlcipher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-sqlcipher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-sqlcipher:
    name: SQLCipher encryption on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve example dependencies
        working-directory: mobile/example
        run: flutter pub get

      - name: Analyze Android test host
        working-directory: mobile/example
        run: flutter analyze

      - name: Run SQLCipher integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd mobile/example && flutter test integration_test/encrypted_store_test.dart -d emulator-5554

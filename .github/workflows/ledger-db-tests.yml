name: Ledger PostgreSQL tests

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "db/tests/**"
      - "docs/**"
      - "server/**"
      - ".github/workflows/ledger-db-tests.yml"
  push:
    branches:
      - main
      - "prototype/**"

permissions:
  contents: read

jobs:
  postgres-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply prototype migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/001_core_ledger.sql
      - name: Run ledger invariant tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/001_core_ledger_test.sql

      - name: Apply obligations and approvals migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/002_obligations_payments_approvals.sql
      - name: Run obligations, allocations, and approval tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/002_obligations_payments_approvals_test.sql

      - name: Apply approval idempotency hardening migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/003_approval_idempotency_reason.sql
      - name: Run approval idempotency payload tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/003_approval_idempotency_reason_test.sql

      - name: Apply offline sync inbox and event feed migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/004_offline_sync_inbox_events.sql
      - name: Run offline sync inbox and event feed tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/004_offline_sync_inbox_events_test.sql

      - name: Apply settlement reset gate migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/005_settlement_reset_gate.sql
      - name: Run settlement reset gate tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/005_settlement_reset_gate_test.sql

      - name: Apply relationship-scoped allocation optimization
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/006_scope_allocation_aggregates.sql
      - name: Re-run allocation and financial invariant tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/002_obligations_payments_approvals_test.sql

      - name: Apply bilateral settlement reset decision migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/007_settlement_reset_decisions.sql
      - name: Apply white-page account cycles migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/008_white_page_account_cycles.sql
      - name: Run white-page account cycle tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/007_settlement_reset_decisions_test.sql

      - name: Run full financial lifecycle through white-page reset
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/008_full_financial_lifecycle_white_page_test.sql

      - name: Apply approved sales returns and signed credit balances

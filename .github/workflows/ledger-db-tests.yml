      - name: Apply bilateral relationship invitation migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/011_relationship_invitations.sql

      - name: Run relationship invitation and activation tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/012_relationship_invitations_test.sql

      - name: Apply rotating refresh token migration
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/migrations/012_identity_refresh_tokens.sql

      - name: Run refresh token rotation and reuse detection tests
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/tests/013_identity_refresh_tokens_test.sql

      - name: Apply append-only device event log migration

name: Mobile offline store checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-offline-store.yml"

permissions:
  contents: read

jobs:
  mobile-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Format check
        working-directory: mobile
        run: dart format --output=show lib test
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Unit tests
        working-directory: mobile
        run: flutter test

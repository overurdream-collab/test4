name: PostgreSQL million-event scale benchmark

on:
  pull_request:
    paths:
      - "db/benchmarks/*.sql"
      - "server/bench/**"
      - ".github/workflows/postgres-scale-benchmark.yml"

permissions:
  contents: read

jobs:
  scale-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and report runner resources
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          nproc
          free -h
      - name: Start PostgreSQL with pg_stat_statements preloaded
        run: |
          docker run -d --name ledger-bench-postgres \
            -e POSTGRES_USER=ledger_test \
            -e POSTGRES_PASSWORD=ledger_test \
            -e POSTGRES_DB=ledger_test \
            -p 5432:5432 postgres:16 \
            -c shared_preload_libraries=pg_stat_statements
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -U ledger_test -d ledger_test; then exit 0; fi
            sleep 2
          done
          docker logs ledger-bench-postgres
          exit 1
      - name: Enable pg_stat_statements
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
      - name: Install benchmark dependencies
        working-directory: server
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: ledger_test
        run: |
          for migration in db/migrations/001_core_ledger.sql db/migrations/002_obligations_payments_approvals.sql db/migrations/003_approval_idempotency_reason.sql db/migrations/004_offline_sync_inbox_events.sql db/migrations/005_settlement_reset_gate.sql db/migrations/006_scope_allocation_aggregates.sql; do
            psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Seed one million operations and events
        env:
          PGPASSWORD: ledger_test
        run: psql -h localhost -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 -f db/benchmarks/001_seed_one_million_events.sql
      - name: Run read and write concurrency benchmarks
        working-directory: server
        env:
          DATABASE_URL: postgres://ledger_test:ledger_test@localhost:5432/ledger_test
        run: node bench/postgres-scale.mjs
      - name: Profile financial lifecycle waits, locks, WAL, and query IDs
        working-directory: server
        env:
          DATABASE_URL: postgres://ledger_test:ledger_test@localhost:5432/ledger_test
          FINANCIAL_PROFILE_DURATION_MS: 60000
        run: node bench/financial-profile.mjs
